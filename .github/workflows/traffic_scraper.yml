name: Automated 4x Daily Traffic Data Collection
on:
  schedule:
    - cron: '30 18 * * *'   # 12:00 AM IST
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '30 7 * * *'    # 1:00 PM IST
    - cron: '30 13 * * *'   # 7:00 PM IST
  workflow_dispatch:
    inputs:
      slot:
        description: 'Select Time Slot'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '12:00 AM'
          - '10:00 AM'
          - '1:00 PM'
          - '7:00 PM'
permissions:
  contents: write
jobs:
  scrape-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth node-cron exceljs
      - name: Install Chrome & Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg xvfb
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Run Traffic Scraper
        env:
          HEADLESS: "new"
          CI: "true"
        run: |
          mkdir -p output
          echo "Running scraper..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper.js run
      - name: Save & Commit Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-collect traffic data: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M %p IST')" || exit 0
          git pull --rebase origin main || true
          git push origin main
